version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store-intelligence-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./store_intelligence.db
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./store_intelligence.db:/app/store_intelligence.db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  data:
  db:
